name: azharshaikh7898-ci

on:
  push:
    branches: [main]
    paths: ["submissions/azharshaikh7898/**"]
  pull_request:
    paths: ["submissions/azharshaikh7898/**"]

defaults:
  run:
    working-directory: submissions/azharshaikh7898

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: submissions/azharshaikh7898/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: POSTGRES_PASSWORD=ci JWT_SECRET=ci docker compose config -q
      - name: Build image
        run: docker build -t documind-app:ci .
